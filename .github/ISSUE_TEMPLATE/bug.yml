name: Bug report
description: Something does not work the way the docs or Kubernetes say it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Security problems go through SECURITY.md, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, manifests or config that show the problem. Remove any secrets.
      render: shell
    validations:
      required: true
  - type: textarea
    id: kubernetes
    attributes:
      label: Kubernetes behaviour
      description: If this is a compatibility bug, what does a real Kubernetes cluster do with the same input?
  - type: input
    id: version
    attributes:
      label: flotilla version or commit
      placeholder: "v0.1.0 or a commit hash"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client and version
      placeholder: "kubectl v1.35.0, helm v4.0.0, kube-rs 4.2"
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04, WSL2 on Windows 11"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant server or node logs. Remove any tokens, keys or Secret values.
      render: text
